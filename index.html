<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff5f2">
  <meta name="description" content="活動記録表、服薬管理、気分・睡眠記録、読書支援、UP記録表のホームページ。">
  <title>日々の記録 | App Menu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Rethink Sans", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #192e26;
      background: #eff5f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { width: min(100% - 40px, 1060px); margin-inline: auto; }
    header { border-bottom: 1px solid #dce6e0; }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: .03em;
    }
    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 5px);
      gap: 3px;
      padding: 9px;
      border-radius: 9px;
      background: #22533f;
    }
    .brand-mark i { width: 5px; height: 5px; border-radius: 1px; background: #e5faee; }
    main { padding-block: 32px 44px; }
    .hero {
      padding: clamp(28px, 6vw, 68px);
      border-radius: 26px;
      background: radial-gradient(ellipse at 100% 0, #437859 0, transparent 62%), #153e30;
      color: #fff;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(2.1rem, 6.5vw, 4.25rem); line-height: 1.22; letter-spacing: .035em; }
    .hero p { margin-top: 16px; color: #e1f2e8; line-height: 1.8; }
    section { margin-top: 32px; }
    h2 { margin-bottom: 14px; font-size: 1.25rem; letter-spacing: .035em; }
    ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
    .card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      height: 100%;
      padding: 16px;
      border: 1px solid #dce6e0;
      border-radius: 19px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: border-color .16s, box-shadow .16s;
    }
    .card:hover { border-color: #6a9a82; box-shadow: 0 7px 20px #153e3010; }
    .card:focus-visible { outline: 3px solid #287b58; outline-offset: 3px; }
    .card img { display: block; width: clamp(56px, 8vw, 80px); height: auto; border-radius: 22%; }
    h3 { font-size: 1rem; line-height: 1.5; overflow-wrap: anywhere; }
    .card p { margin-top: 5px; color: #4a5e53; font-size: .85rem; line-height: 1.55; }
    .arrow {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #eaf4ee;
      color: #22533f;
      font-size: 1.1rem;
    }
    .card:hover .arrow { background: #22533f; color: white; }
    @media (max-width: 720px) {
      ul { grid-template-columns: 1fr; gap: 10px; }
      .brand { min-height: 60px; }
      main { padding-top: 20px; }
      section { margin-top: 23px; }
    }
    @media (max-width: 380px) {
      .shell { width: calc(100% - 28px); }
      .card { gap: 9px; padding: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
